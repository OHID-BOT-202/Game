<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Ohid Clash Squad 3D</title>
<style>
html,body{margin:0;overflow:hidden;background:#071018;color:white;font-family:Arial;touch-action:none}
#game{position:fixed;inset:0}canvas{display:block}
#hud{position:fixed;inset:0;pointer-events:none}
.panel{background:#071018cc;border:1px solid #ffffff33;border-radius:12px;padding:10px}
#top{display:flex;justify-content:space-between;padding:12px}
#minimap{position:absolute;right:12px;top:90px;width:125px;height:125px;border:2px solid #ffffff66;border-radius:12px;background:#123;overflow:hidden}
#mini{width:100%;height:100%}
#cross{position:absolute;left:50%;top:50%;width:24px;height:24px;transform:translate(-50%,-50%)}
#cross:before,#cross:after{content:"";position:absolute;background:white}
#cross:before{left:11px;width:2px;height:24px}.cross:after{top:11px;width:24px;height:2px}
#bottom{position:absolute;bottom:18px;left:14px;right:14px;display:flex;justify-content:space-between;align-items:end}
button{pointer-events:auto;background:#071018dd;color:white;border:1px solid #ffffff66;border-radius:12px;padding:13px;font-weight:bold}
#fire{width:75px;height:75px;border-radius:50%;background:#d83a4d99}
#gloo{width:70px;height:70px;border-radius:50%;background:#16b8d766}
#reload{position:absolute;right:165px;bottom:135px}
.stick{position:absolute;bottom:32px;width:115px;height:115px;border:2px solid #ffffff38;border-radius:50%;background:#ffffff0b;pointer-events:auto}
#move{left:22px}#aim{right:22px}.knob{position:absolute;left:29px;top:29px;width:55px;height:55px;border-radius:50%;background:#ffffff2b}
#start{position:fixed;inset:0;z-index:4;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle,#194d55,#05090f 75%)}
.card{width:min(90%,420px);padding:28px;text-align:center;border:1px solid #ffffff33;border-radius:22px;background:#07131ddd}
.card h1{color:#8be9fd}.start{background:linear-gradient(100deg,#00c6ff,#7b2cff)}
</style>
</head>
<body>
<div id="game"></div>
<div id="start"><div class="card"><h1>CLASH SQUAD 3D</h1><p>1 vs 4 • Clock Tower map • Unlimited Gloo Wall</p><p id="loading">Loading 3D assets...</p><button class="start" id="play" disabled>ENTER BATTLE</button></div></div>
<div id="hud">
<div id="top"><div class="panel">ROUND: <b id="round">1</b><br>ALIVE: <b id="alive">5</b><br>KILLS: <b id="kills">0</b></div><div class="panel">ASSAULT RIFLE<br><b id="ammo">30</b> / 120</div></div>
<div id="minimap"><canvas id="mini" width="240" height="240"></canvas></div><div id="cross"></div>
<div id="bottom"><div>HP <b id="hpText">100</b><div style="width:220px;height:16px;background:#18242a;border-radius:10px"><div id="hp" style="height:100%;width:100%;background:linear-gradient(90deg,#ef476f,#ffd166);border-radius:10px"></div></div></div><div><button id="gloo">GLOO<br>∞</button><button id="fire">FIRE</button></div></div>
<button id="reload">RELOAD</button></div>
<div class="stick" id="move"><div class="knob"></div></div><div class="stick" id="aim"><div class="knob"></div></div>
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/examples/js/loaders/GLTFLoader.js"></script>
<script>
(()=>{let scene,camera,renderer,clock,player,foes=[],walls=[],running=false,fire=false,ammo=30,kills=0;
const mini=document.getElementById('mini'),m=mini.getContext('2d'),keys={},move={active:false,x:0,y:0},aim={active:false,x:0,y:0};
addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=1;if(e.key.toLowerCase()=='r')reload()});addEventListener('keyup',e=>keys[e.key.toLowerCase()]=0);
function setup(){scene=new THREE.Scene();scene.background=new THREE.Color(0x09141b);scene.fog=new THREE.Fog(0x09141b,250,1300);camera=new THREE.PerspectiveCamera(65,innerWidth/innerHeight,.1,2000);renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.shadowMap.enabled=true;document.getElementById('game').appendChild(renderer.domElement);resize();scene.add(new THREE.HemisphereLight(0xbfefff,0x203020,2));let s=new THREE.DirectionalLight(0xffffff,2);s.position.set(200,400,100);scene.add(s);let g=new THREE.Mesh(new THREE.PlaneGeometry(1200,1200),new THREE.MeshStandardMaterial({color:0x315b43}));g.rotation.x=-Math.PI/2;scene.add(g)}
function resize(){if(!renderer)return;renderer.setSize(innerWidth,innerHeight);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix()}addEventListener('resize',resize);
function dummy(c){let x=new THREE.Group(),b=new THREE.Mesh(new THREE.CapsuleGeometry(5,12,4,8),new THREE.MeshStandardMaterial({color:c}));b.position.y=12;x.add(b);let h=new THREE.Mesh(new THREE.SphereGeometry(4.5,16,12),new THREE.MeshStandardMaterial({color:0xf0c8a0}));h.position.y=25;x.add(h);return x}
function load(){let l=new THREE.GLTFLoader(),n=0,done=()=>{if(++n==2){document.getElementById('loading').textContent='3D assets loaded';document.getElementById('play').disabled=false}};l.load('player.glb',g=>{player=dummy(0x00c6ff);player.add(g.scene);scene.add(player);done()},done);l.load('clock_tower_map.glb',g=>{scene.add(g.scene);done()},done)}
function reset(){foes.forEach(x=>scene.remove(x));walls.forEach(x=>scene.remove(x));foes=[];walls=[];ammo=30;kills=0;player.position.set(0,0,0);for(let i=0;i<4;i++){let a=i*Math.PI/2+.5,x=dummy(0xef476f);x.position.set(Math.cos(a)*120,0,Math.sin(a)*120);x.userData.hp=100;scene.add(x);foes.push(x)}hud()}
function hud(){document.getElementById('alive').textContent=1+foes.filter(x=>x.userData.hp>0).length;document.getElementById('kills').textContent=kills;document.getElementById('ammo').textContent=ammo;document.getElementById('hpText').textContent=Math.max(0,Math.round(player.userData.hp||100));document.getElementById('hp').style.width=Math.max(0,player.userData.hp||100)+'%'}
function shoot(){if(ammo<=0)return;ammo--;for(let x of foes)if(x.userData.hp>0&&x.position.distanceTo(player.position)<220){x.userData.hp-=35;if(x.userData.hp<=0){scene.remove(x);kills++}break}hud()}
function reload(){ammo=30;hud()}
function wall(){let w=new THREE.Mesh(new THREE.BoxGeometry(24,24,3),new THREE.MeshStandardMaterial({color:0x31d7e8,transparent:true,opacity:.75}));w.position.set(player.position.x,12,player.position.z-24);scene.add(w);walls.push(w)}
function update(dt){let x=(keys.d?1:0)-(keys.a?1:0),z=(keys.s?1:0)-(keys.w?1:0);if(move.active){x=move.x;z=move.y}let q=Math.hypot(x,z)||1;player.position.x+=x/q*100*dt;player.position.z+=z/q*100*dt;if(fire){shoot();fire=false}for(let f of foes)if(f.userData.hp>0){let a=Math.atan2(player.position.x-f.position.x,player.position.z-f.position.z);f.position.x+=Math.sin(a)*20*dt;f.position.z+=Math.cos(a)*20*dt}if(foes.every(f=>f.userData.hp<=0)){running=false;document.getElementById('start').style.display='flex'}hud()}
function miniMap(){m.clearRect(0,0,240,240);m.fillStyle='#173e31';m.fillRect(0,0,240,240);let s=240/1200;m.fillStyle='#00d4ff';m.beginPath();m.arc(120+player.position.x*s,120+player.position.z*s,5,0,7);m.fill();for(let f of foes)if(f.userData.hp>0){m.fillStyle='#ef476f';m.fillRect(120+f.position.x*s-3,120+f.position.z*s-3,6,6)}}
function loop(){requestAnimationFrame(loop);let dt=clock.getDelta();if(running)update(Math.min(dt,.033));camera.position.lerp(new THREE.Vector3(player.position.x,75,player.position.z+110),.08);camera.lookAt(player.position.x,12,player.position.z);renderer.render(scene,camera);miniMap()}
function stick(el,o){let k=el.querySelector('.knob');function set(e){let r=el.getBoundingClientRect(),x=e.clientX-r.left-r.width/2,y=e.clientY-r.top-r.height/2,l=Math.hypot(x,y),lim=42;if(l>lim){x=x/l*lim;y=y/l*lim}o.x=x/lim;o.y=y/lim;k.style.transform='translate('+x+'px,'+y+'px)'}el.onpointerdown=e=>{o.active=true;el.setPointerCapture(e.pointerId);set(e)};el.onpointermove=e=>o.active&&set(e);el.onpointerup=()=>{o.active=false;o.x=o.y=0;k.style.transform='translate(0,0)'}}
stick(document.getElementById('move'),move);stick(document.getElementById('aim'),aim);document.getElementById('fire').onpointerdown=()=>fire=true;document.getElementById('gloo').onclick=wall;document.getElementById('reload').onclick=reload;document.getElementById('play').onclick=()=>{document.getElementById('start').style.display='none';reset();running=true};
setup();clock=new THREE.Clock();load();player={position:new THREE.Vector3(),userData:{hp:100}};requestAnimationFrame(loop)})()
</script>
</body>
</html>
